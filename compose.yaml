services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set the publicly reachable API URL including /api/v1}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
